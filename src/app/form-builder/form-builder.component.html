<h2>Form Builder</h2>


<select [(ngModel)]="newField.type">
  <option value="text">Text</option>
  <option value="dropdown">Dropdown</option>
  <option value="checkbox">Checkbox</option>
</select>

<input type="text" placeholder="Label" [(ngModel)]="newField.label">
<input type="text" placeholder="Name" [(ngModel)]="newField.name">

@if (newField.type === 'dropdown') {
  <div>
    <input type="text" #optionInput placeholder="Option">
    <button (click)="onAddOption(optionInput.value); optionInput.value=''">Add Option</button>

    <ul>
      @for (opt of newField.options; track opt) {
        <li>{{opt}}</li>
      }
    </ul>
  </div>
}

<button (click)="addField()">Add Field</button>
<button (click)="saveForm()">Save Form</button>

<hr>

<pre>{{ formFields | json }}</pre>
